<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>工程叫料小幫手・電腦版</title>
<link rel="icon" href="app-icon-192.png">
<style>
/* 電腦版管理介面：網頁本身不放任何資料，登入後才向後台（Google 試算表）拿，後台會檢查是不是管理員。 */
:root{--side:#2f4059;--side2:#3c4f6b;--sidetx:#dfe6f0;--navon:#dbe6f5;--navontx:#22385a;--hero1:#e3ecf7;--hero2:#f4f7fb;--herotx:#223a5e;--herob:#d9e3f0;
 --acc:#5b82b8;--acc2:#3f679e;--accl:#eef3fa;--bg:#f5f7fa;--line:#e6ebf1;--card:#fff;--tx:#3a3f47;--mu:#7d838d;
 --green:#4f9a6c;--greenl:#eef7f1;--red:#c45a5a;--redl:#fbf0f0;--amber:#b7822f;--amberl:#fbf5ea;
 --font:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;color-scheme:light}
:root[data-theme="鼠尾草"]{--side:#3d4f47;--side2:#4a5e55;--sidetx:#e3ebe6;--navon:#dce9df;--navontx:#2d4a38;--hero1:#e2eee5;--hero2:#f4f8f4;--herotx:#2d4a38;--herob:#d6e6da;--acc:#6f9a7f;--acc2:#4f7d61;--accl:#eef5f0;--bg:#f5f7f4;--line:#e5ebe6}
:root[data-theme="奶茶杏"]{--side:#4a4440;--side2:#5a524d;--sidetx:#efe8e2;--navon:#f3d9c6;--navontx:#5a3420;--hero1:#fbe6d6;--hero2:#fdf3ea;--herotx:#5a3420;--herob:#f2dccb;--acc:#d98a5f;--acc2:#b0603a;--accl:#fdf3ec;--bg:#f7f4f0;--line:#ece6df}
:root[data-theme="莫蘭迪紫"]{--side:#4a4458;--side2:#585168;--sidetx:#ebe7f2;--navon:#e6dff2;--navontx:#41355e;--hero1:#ece6f5;--hero2:#f8f5fb;--herotx:#41355e;--herob:#e1d9ee;--acc:#9483bd;--acc2:#6f5e9c;--accl:#f3f0fa;--bg:#f7f6f9;--line:#e9e6ef}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--sidetx);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.logo{padding:20px 18px;border-bottom:1px solid var(--side2)}
.logo b{display:block;color:#fff;font-size:17px;font-weight:700;line-height:1.3;letter-spacing:.03em}
.logo small{opacity:.7}
.grp{padding:14px 18px 4px;font-size:12px;opacity:.65;letter-spacing:.05em}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.nav button{background:none;border:0;color:var(--sidetx);text-align:left;padding:9px 14px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:8px}
.nav button:hover{background:var(--side2)}
.nav button.on{background:var(--navon);color:var(--navontx);font-weight:700}
.nav button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.nav .soon{margin-left:auto;font-size:10px;opacity:.7;border:1px solid currentColor;border-radius:99px;padding:0 6px}
.me{margin-top:auto;border-top:1px solid var(--side2);padding:14px 18px;display:flex;gap:10px;align-items:center}
.me .av{width:34px;height:34px;border-radius:50%;background:var(--navon);color:var(--navontx);display:grid;place-items:center;font-weight:700;flex:none}
.me b{color:#fff;display:block;line-height:1.2}
.me button{margin-left:auto;background:none;border:1px solid var(--side2);color:var(--sidetx);border-radius:8px;padding:2px 8px;cursor:pointer;font-size:12px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .date{margin-left:auto;color:var(--mu)}
.th-pick{display:flex;gap:6px;align-items:center;color:var(--mu);font-size:12px}
.th-pick button{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0002;cursor:pointer;padding:0}
.th-pick button.on{box-shadow:0 0 0 2px var(--tx)}
.hero{background:linear-gradient(110deg,var(--hero1),var(--hero2));color:var(--herotx);padding:20px 32px;border-bottom:1px solid var(--herob)}
.hero .eb{font-size:13px;opacity:.75}
.hero h1{margin:2px 0;font-size:26px;font-weight:700}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pills span{background:#ffffffb3;border:1px solid var(--herob);border-radius:99px;padding:1px 10px;font-size:12px}
.content{padding:22px 26px 48px;display:flex;flex-direction:column;gap:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 18px;box-shadow:0 2px 10px #1a2a4008}
.stat .n{font-size:28px;font-weight:700}.stat .n small{font-size:15px}.stat .m{color:var(--mu);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1150px){.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 2px 10px #1a2a4008;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.panel h3{margin:0;padding:14px 20px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel h3 small{color:var(--mu);font-weight:400}
.f{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;align-items:center}
.f .grow{flex:1;min-width:180px}
.f .r{margin-left:auto;display:flex;gap:8px}
input.in,select.in,textarea.in{border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff;width:100%}
.f input.in,.f select.in{width:auto}
.f input.in.grow{width:100%}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accl)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn.pri:hover{background:var(--acc2)}
.btn.sm{padding:2px 10px;font-size:13px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.tabs2{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs2 button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;white-space:nowrap}
.tabs2 button.on{border-color:var(--acc);color:var(--acc2);font-weight:700}
.tabs2 .c{border-radius:99px;padding:0 7px;font-size:11px;margin-left:4px;background:#eef1f5}
.tw{overflow:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#fafbfc;color:var(--mu);font-weight:500;font-size:12px;white-space:nowrap;position:sticky;top:0}
td.n,th.n{text-align:right}
td small{display:block;color:var(--mu);font-size:12px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--accl)}
.st{font-size:12px;padding:1px 10px;border-radius:99px;white-space:nowrap;display:inline-block}
.s-ok{background:var(--greenl);color:var(--green)}
.s-bad{background:#fde8e6;color:#b4382c}.s-warn{background:var(--amberl);color:#8a5a00}.s-none{background:#eef0f3;color:#6b7280}
.ship2{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:16px;align-items:start}@media (max-width:900px){.ship2{grid-template-columns:1fr}}
tr.sel td{background:var(--accl)}
.shipt td small{display:block}.shipt input.in.qin{width:90px;text-align:right}.ship2 .tabs2{flex-wrap:wrap;overflow:visible}.qin.sug{background:#fff6d6;border-color:#e0b100}
.phs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}.ph{position:relative;width:120px;height:120px;border-radius:12px;overflow:hidden;background:#eef0f3;display:flex;align-items:center;justify-content:center;cursor:zoom-in;font-size:12px;color:var(--mu)}.ph img{width:100%;height:100%;object-fit:cover}
.phx{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:16px;line-height:26px;cursor:pointer;padding:0}
.phbig{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:zoom-out;color:#fff;font-size:13px}.phbig img{max-width:94vw;max-height:88vh;border-radius:8px}
.ocr{white-space:pre-wrap;background:#f6f7f9;border-radius:10px;padding:10px;font-size:12px;max-height:220px;overflow:auto;margin:6px 0 0}.s-bad{background:var(--redl);color:var(--red)}.s-wait{background:var(--amberl);color:var(--amber)}.s-go{background:var(--accl);color:var(--acc2)}
.note{margin:12px 18px;background:var(--accl);border-radius:14px;padding:10px 14px}
.warn{margin:12px 18px;background:var(--amberl);border-radius:14px;padding:10px 14px}
.empty{padding:28px 18px;color:var(--mu);text-align:center}
.bar-row{display:grid;grid-template-columns:120px 1fr 80px;gap:10px;align-items:center;padding:9px 20px;border-bottom:1px solid var(--line)}
.track{height:7px;background:#eef1f5;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.dlg-bg{position:fixed;inset:0;background:#1a2a4040;z-index:50}
.dlg{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 20px 60px #1a2a4030}
.dlg h2{margin:0 0 12px;font-size:19px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 label,.dlg label{display:block;font-size:13px;color:var(--mu)}
.grid2 label .in,.dlg label .in{color:var(--tx);font-size:14px;margin-top:2px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:14px}
.frame{width:100%;height:calc(100vh - 170px);min-height:600px;border:0;background:#fff;display:block}
.gate{max-width:460px;margin:12vh auto;background:#fff;border-radius:20px;padding:28px;box-shadow:0 10px 40px #1a2a4018;text-align:center}
.gate h1{font-size:22px;margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2f4059;color:#fff;padding:10px 18px;border-radius:12px;z-index:60;box-shadow:0 8px 24px #0003}
.spin{color:var(--mu);padding:40px;text-align:center}
</style>
</head>
<body>
<div id="root"><div class="spin">載入中…</div></div>
<script>
(function(){
"use strict";
var CFG_KEY="jiaoliao_sync_cfg",ACT_KEY="jiaoliao_last_act",IDLE_MS=5*60*1000;
var SYNC_URL="https://script.google.com/macros/s/AKfycbwf1DwO6ARo_ePfa3TT3ZPecLmNnqjksK3sPxcIN-5_Obn3mHSQerYo1rRzQRJyNtM/exec";
var COMPANIES=["聖和工程有限公司","紘誠水電工程行","澧育有限公司","白鐵工程行"];
function $(id){return document.getElementById(id)}
function jget(k,d){try{var s=localStorage.getItem(k);return s?JSON.parse(s):d}catch(e){return d}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function cfg(){var c=jget(CFG_KEY,{});c.url=c.url||SYNC_URL;return c}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(ch){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]})}
function touch(){try{localStorage.setItem(ACT_KEY,String(Date.now()))}catch(e){}}
function idle(){return Date.now()-(+localStorage.getItem(ACT_KEY)||0)>IDLE_MS}
function api(body){var c=cfg();body.who=c.who;body.code=c.code;return fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}).then(function(r){return r.json()})}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2600)}
function goPhone(){try{sessionStorage.setItem("jl_mobile","1")}catch(e){}location.href="index.html"}
function gate(title,text,btn){$("root").innerHTML='<div class="gate"><h1>'+esc(title)+'</h1><p>'+esc(text)+'</p><p><button class="btn pri" id="gGo" type="button">'+esc(btn)+'</button></p></div>';$("gGo").onclick=function(){location.href="index.html"}}

// ---------- 登入檢查：沒登入、閒置太久、不是管理員都進不來 ----------
var C=cfg();
if(!(C.who&&C.code)||C.locked||idle()){gate("請先登入","電腦版要用叫料小幫手的帳號登入，登入後會自動回到電腦版。","前往登入");return}
["click","keydown","scroll","mousemove"].forEach(function(ev){addEventListener(ev,function(){if(idle()){location.href="index.html";return}touch()},{passive:true})});
setInterval(function(){if(idle())location.href="index.html"},30000);
touch();

// ---------- 狀態 ----------
var S={page:"home",orders:[],deleted:[],sites:[],users:null,tables:{},filt:{site:"",who:"",month:"",q:"",tab:"list"},siteTab:"list",vTab:"常用廠商名單",vq:"",vcat:"全部",vDel:false,dlg:null};
var NAV=[["工地管理",[["home","首頁儀表板"],["jl","進料管理"],["newjl","手動叫料"],["hist","叫料紀錄"],["sum","叫料統計"],["ship","出貨核對"],["cmp","比價下單",1],["bill","帳單核對",1],["price","價目表",1]]],
 ["基本資料",[["sites","工地資料（收貨人）"],["vendor","廠商資料"]]],
 ["系統",[["user","使用者管理"],["phone","切換到手機版"]]]];
var now=new Date();
var TODAY=fmtD(now),MONTH=TODAY.slice(0,7);
function fmtD(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function normD(s){s=String(s||"").trim();var m=s.match(/(\d{2,4})\D(\d{1,2})\D(\d{1,2})/);if(!m)return "";var y=+m[1];if(y<1000)y+=1911;return y+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[3]).slice(-2)}
function O(x){return x.order||{}}
function oDate(x){return normD(O(x).orderDate)||""}
function oDue(x){return normD(O(x).dueDate)||""}
function lines(x){return O(x).lines||[]}

function load(){
  return api({action:"login"}).then(function(j){
    if(!j.ok){gate("登入失效",j.error||"請重新登入","重新登入");throw 0}
    if(j.role!=="admin"){var cu=cfg();cu.role="user";jset(CFG_KEY,cu);try{sessionStorage.setItem("jl_mobile","1")}catch(e){}gate("這裡是管理員專用","你的帳號是助理，請用手機版叫料。","回手機版");throw 0}
    var c=cfg();c.role="admin";jset(CFG_KEY,c);
    return api({action:"pull",all:true});
  }).then(function(j){
    if(!j.ok)throw new Error(j.error||"讀取失敗");
    var dead={};(j.deleted||[]).forEach(function(d){dead[d.id]=1});
    S.orders=(j.orders||[]).filter(function(x){return !dead[x.id]}).sort(function(a,b){return (oDate(b)+(O(b).no||"")).localeCompare(oDate(a)+(O(a).no||""))});
    S.sites=j.sites||[];
    S.ships=null;S.shipErr="";return loadShips();
  });
}

// ---------- 畫面骨架 ----------
function shell(){
  var c=cfg();
  $("root").innerHTML='<div class="app"><aside class="side"><div class="logo"><b>聖和工程<br>工程叫料小幫手</b><small>電腦版・管理員</small></div>'+
   NAV.map(function(g){return '<div class="grp">'+g[0]+'</div><div class="nav">'+g[1].map(function(n){return '<button type="button" data-p="'+n[0]+'">'+esc(n[1])+(n[2]?'<span class="soon">下一階段</span>':'')+'</button>'}).join("")+'</div>'}).join("")+
   '<div class="me"><span class="av">'+esc(String(c.who||"?").slice(0,1))+'</span><div><b>'+esc(c.who)+'</b><small>管理員</small></div><button type="button" id="logout">登出</button></div></aside>'+
   '<main class="main"><div class="topbar"><button class="btn sm" type="button" id="reload">⟳ 重新整理資料</button><span id="lastLoad" style="color:var(--mu);font-size:12px"></span>'+
   '<span class="th-pick">配色 '+[["霧藍","#2f4059","#5b82b8"],["鼠尾草","#3d4f47","#6f9a7f"],["奶茶杏","#4a4440","#d98a5f"],["莫蘭迪紫","#4a4458","#9483bd"]].map(function(t){return '<button type="button" data-th="'+t[0]+'" title="'+t[0]+'" aria-label="配色：'+t[0]+'" style="background:linear-gradient(135deg,'+t[1]+' 50%,'+t[2]+' 50%)"></button>'}).join("")+'</span>'+
   '<span class="date">'+now.getFullYear()+' 年 '+(now.getMonth()+1)+' 月 '+now.getDate()+' 日　星期'+"日一二三四五六"[now.getDay()]+'</span></div><div id="page"></div></main></div><div id="dlgHost"></div>';
  document.querySelector(".side").addEventListener("click",function(e){var b=e.target.closest("[data-p]");if(!b)return;if(b.dataset.p==="phone"){goPhone();return}S.page=b.dataset.p;render();scrollTo(0,0)});
  $("logout").onclick=function(){if(!confirm("要登出嗎？"))return;var c=cfg();c.locked=true;jset(CFG_KEY,c);location.href="index.html"};
  $("reload").onclick=function(){$("page").innerHTML='<div class="spin">重新讀取中…</div>';Promise.all([load(),S.users?loadUsers():null]).then(function(){S.tables={};render();toast("已更新")}).catch(function(e){if(e)toast("讀取失敗："+(e.message||e))})};
  document.querySelector(".th-pick").addEventListener("click",function(e){var b=e.target.closest("[data-th]");if(b)setTheme(b.dataset.th)});
  var t="霧藍";try{t=localStorage.getItem("jl_desk_theme")||t}catch(e){}setTheme(t);
  $("page").addEventListener("click",onClick);$("page").addEventListener("input",onInput);$("page").addEventListener("change",onChange);
  $("dlgHost").addEventListener("click",onDlgClick);
}
function setTheme(k){document.documentElement.dataset.theme=k==="霧藍"?"":k;document.querySelectorAll("[data-th]").forEach(function(b){b.classList.toggle("on",b.dataset.th===k)});try{localStorage.setItem("jl_desk_theme",k)}catch(e){}}
function hero(eb,title,pills){return '<div class="hero"><div class="eb">'+esc(eb)+'</div><h1>'+esc(title)+'</h1>'+(pills&&pills.length?'<div class="pills">'+pills.map(function(p){return '<span>'+esc(p)+'</span>'}).join("")+'</div>':'')+'</div>'}
function render(){
  document.querySelectorAll(".nav [data-p]").forEach(function(b){b.classList.toggle("on",b.dataset.p===S.page)});
  var f=PAGES[S.page]||pSoon;$("page").innerHTML=f();
  $("lastLoad").textContent="資料時間 "+new Date().toTimeString().slice(0,5);
  if(S.page==="vendor"&&!S.tables[S.vTab])loadTable(S.vTab);
  if(S.page==="user"&&!S.users)loadUsers().then(render);
  renderDlg();
}

// ---------- 首頁儀表板 ----------
function pHome(){
  var mo=S.orders.filter(function(x){return oDate(x).slice(0,7)===MONTH});
  var today=S.orders.filter(function(x){return oDate(x)===TODAY});
  var dueToday=S.orders.filter(function(x){return oDue(x)===TODAY});
  var soon=S.orders.filter(function(x){var d=oDue(x);return d>TODAY&&d<=fmtD(new Date(Date.now()+3*864e5))});
  var bySite={};mo.forEach(function(x){var s=O(x).site||"（未填工地）";var b=bySite[s]||(bySite[s]={n:0,items:0,last:""});b.n++;b.items+=lines(x).length;if(oDate(x)>b.last)b.last=oDate(x)});
  var rows=Object.keys(bySite).map(function(k){return [k,bySite[k]]}).sort(function(a,b){return b[1].n-a[1].n});
  var max=rows.length?rows[0][1].n:1;
  var byWho={};mo.forEach(function(x){byWho[x.who]=(byWho[x.who]||0)+1});
  return hero("首頁儀表板","全部工地總覽",["本月叫料 "+mo.length+" 張","今天叫料 "+today.length+" 張","今天要到貨 "+dueToday.length+" 張"])+'<div class="content">'+
  '<div class="stats"><div class="stat"><div class="m">本月叫料單</div><div class="n">'+mo.length+'<small> 張</small></div><div class="m">共 '+mo.reduce(function(a,x){return a+lines(x).length},0)+' 個品項</div></div>'+

    st[k]=v===w?"ok":v<w?(v===0?"none":"short"):"over";if(v<w)short++;if(v>w)over++});

}

function normT(s){return String(s||"").replace(/[！-～]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0)}).replace(/[″”〃]/g,'"').replace(/[′’]/g,"'").replace(/\s+/g,"").toLowerCase()}
// 用照片讀到的文字找每個品項的到貨數量。Google 讀表格常把每一格拆成一行，所以從品名那行往下找，直到下一個品項為止；優先取「數字＋單位」（例如 45支）。
function ocrMatch(x,text){
  var tl=String(text||"").split(/\n/).map(normT).filter(Boolean),out={},ls=lines(x);
  var nameAt=function(l,t){var nm=normT(l.name),sz=normT(l.size),s=0;if(nm&&t.indexOf(nm)>=0)s+=3;else if(nm.length>=2&&t.indexOf(nm.slice(0,2))>=0)s+=1;if(s&&sz&&t.indexOf(sz)>=0)s+=2;return s};
  var starts=ls.map(function(l){var bi=-1,bs=0;tl.forEach(function(t,i){var s=nameAt(l,t);if(s>bs){bs=s;bi=i}});return bs>=1?bi:-1});
  ls.forEach(function(l,i){var st=starts[i];if(st<0)return;var nm=normT(l.name),sz=normT(l.size),u=normT(l.unit||"");
    var seg=[],ok=nameAt(l,tl[st]);
    for(var j=st;j<tl.length&&j<st+6;j++){if(j>st&&starts.indexOf(j)>=0)break;if(j>st&&ls.some(function(o,k){return k!==i&&normT(o.name)&&tl[j].indexOf(normT(o.name))>=0}))break;seg.push(tl[j]);if(j>st&&sz&&tl[j].indexOf(sz)>=0)ok+=2}
    if(ok<3)return;
    var rest=seg.join(" ");if(nm)rest=rest.split(nm).join(" ");if(sz)rest=rest.split(sz).join(" ");
    var w=+l.qty||0,m=u&&rest.match(new RegExp("(\\d+(?:\\.\\d+)?)"+u.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")));
    if(m){out[lkey(l,i)]=+m[1];return}
    var nums=(rest.match(/\d+(\.\d+)?/g)||[]).map(Number);if(!nums.length)return;
    out[lkey(l,i)]=nums.indexOf(w)>=0?w:nums[nums.length-1]});
  return out;
}
function applyOcr(x,d,text){var m=ocrMatch(x,text),n=0;Object.keys(m).forEach(function(k){if(d.recv[k]===undefined||d.recv[k]===""||d.sug[k]){d.recv[k]=m[k];d.sug[k]=1;n++}});d.dirty=d.dirty||n>0;
  d.msg=n?'照片判讀填了 <b>'+n+'</b> 個品項（黃色框），請對照照片確認後按「儲存核對結果」。':'照片上的字沒有對到品項，請手動填數量。';}
function resizeImg(file){return new Promise(function(ok,no){var fr=new FileReader();fr.onerror=no;fr.onload=function(){var im=new Image();im.onerror=function(){no(new Error("這個檔案不是照片"))};im.onload=function(){var k=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",0.85))};im.src=fr.result};fr.readAsDataURL(file)})}

    '<div class="actions">'+(d.row?'<button type="button" class="btn danger" data-vdel="1" style="margin-right:auto">刪除</button>':'')+'<button type="button" class="btn" data-x="1">取消</button><button type="button" class="btn pri" data-vsave="1">儲存</button></div>'}
  if(d.t==="user"){var u=d.u;
    html='<h2>'+(d.isNew?"＋ 新增使用者":"✎ 修改使用者")+'</h2>'+field("u-n","姓名（帳號）",u.name,d.isNew?"":"readonly")+'<div style="margin-top:8px">'+field("u-p","密碼",u.pw||"")+'</div>'+
    '<label style="margin-top:10px">角色<select class="in" id="u-r"><option value="0" '+(u.admin?"":"selected")+'>助理（只能手機叫料）</option><option value="1" '+(u.admin?"selected":"")+'>管理員（全部功能）</option></select></label>'+
    '<label style="margin-top:10px;display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="u-d" '+(u.disabled?"checked":"")+'> 停用（不能登入）</label>'+
    '<div class="actions">'+(d.isNew?"":'<button type="button" class="btn danger" data-udel="1" style="margin-right:auto">刪除帳號</button>')+'<button type="button" class="btn" data-x="1">取消</button><button type="button" class="btn pri" data-usave="1">儲存</button></div>'}
  h.innerHTML='<div class="dlg-bg" data-x="1"></div><div class="dlg" role="dialog">'+html+'</div>';
}
function syncSite(){var s=S.dlg.s;s.name=$("se-n").value.trim();s.co=$("se-co").value;s.addr=$("se-ad").value.trim();document.querySelectorAll("[data-pn]").forEach(function(el){s.ppl[+el.dataset.pn][0]=el.value.trim()});document.querySelectorAll("[data-pt]").forEach(function(el){s.ppl[+el.dataset.pt][1]=el.value.trim()})}
function busy(b){b.disabled=true;b.textContent="儲存中…"}
function onDlgClick(e){
  var d=S.dlg,t;if(!d)return;var q=function(s){return e.target.closest(s)};
  if(q("[data-x]")){S.dlg=null;renderDlg();return}
  if(d.t==="order"){
    var o=d.o;
    var readO=function(){o.site=$("o-site").value.trim();o.company=$("o-co").value.trim();o.orderDate=$("o-od").value.trim();o.dueDate=$("o-dd").value.trim();o.contact=$("o-ct").value.trim();o.contactTel=$("o-tel").value.trim();o.note=$("o-note").value.trim();document.querySelectorAll("[data-lq]").forEach(function(el){o.lines[+el.dataset.lq].qty=+el.value||0})};
    if(t=q("[data-ldel]")){readO();o.lines.splice(+t.dataset.ldel,1);renderDlg();return}
    if(t=q("[data-osave]")){readO();o.lines=o.lines.filter(function(l){return l.qty>0});busy(t);api({action:"adminSaveOrder",order:o,owner:d.x.who}).then(function(j){if(!j.ok)throw new Error(j.error);o.adminRev=j.rev;d.x.order=o;d.x.rev=j.rev;S.dlg=null;toast("已儲存");render()}).catch(function(err){alert("儲存失敗："+(err.message||err));renderDlg()});return}
    if(t=q("[data-odel]")){if(!confirm("確定刪除叫料單 "+(o.no||"")+"？\n（會移到試算表「已刪除」分頁）"))return;busy(t);api({action:"adminDeleteOrder",id:d.x.id,owner:d.x.who}).then(function(j){if(!j.ok)throw new Error(j.error);S.orders=S.orders.filter(function(x){return x.id!==d.x.id});S.dlg=null;toast("已刪除");render()}).catch(function(err){alert("刪除失敗："+(err.message||err));renderDlg()});return}
  }
  if(d.t==="site"){
    var s=d.s;
    if(q("[data-padd]")){syncSite();s.ppl.push(["",""]);renderDlg();return}
    if(t=q("[data-pdel]")){syncSite();var p=s.ppl.splice(+t.dataset.pdel,1)[0];if(p[0])s.gone=(s.gone||[]).concat([p]);renderDlg();return}
    if(t=q("[data-prest]")){syncSite();s.ppl.push(s.gone.splice(+t.dataset.prest,1)[0]);renderDlg();return}
    if(t=q("[data-ssave]")){syncSite();if(!s.name){alert("請填工地名稱");return}
      var orig=d.orig||{ppl:[]};var c={id:s.id,oldName:orig.name,name:s.name,co:s.co,addr:s.addr,add:[],remove:[]};
      s.ppl.filter(function(p){return p[0]}).forEach(function(p){var was=orig.ppl.filter(function(x){return x[0]===p[0]})[0];if(!was||was[1]!==p[1])c.add.push(p)});
      orig.ppl.forEach(function(p){if(!s.ppl.some(function(x){return x[0]===p[0]}))c.remove.push(p[0])});
      busy(t);saveSites([c]).then(function(){S.dlg=null;renderDlg()});return}
    if(q("[data-sdel]")){if(!confirm("刪除工地「"+d.orig.name+"」？之後可以在「已刪除」恢復。"))return;saveSites([{id:s.id,name:d.orig.name,del:true}]).then(function(){S.dlg=null;renderDlg()});return}
  }
  if(d.t==="vrow"){
    if(t=q("[data-vsave]")){var vals={};document.querySelectorAll("[data-vf]").forEach(function(el){vals[el.dataset.vf]=el.value.trim()});busy(t);saveRow(d.name,d.row||0,vals,d.row?undefined:false);return}
    if(q("[data-vdel]")){if(!confirm("刪除這一筆？之後可以在「已刪除」恢復。"))return;saveRow(d.name,d.row,{},true);return}
  }
  if(d.t==="user"){
    if(t=q("[data-usave]")){var u={name:$("u-n").value.trim(),pw:$("u-p").value.trim(),admin:$("u-r").value==="1",disabled:$("u-d").checked};if(!u.name||!u.pw){alert("請填姓名和密碼");return}busy(t);
      api({action:"saveUser",user:u}).then(function(j){if(!j.ok)throw new Error(j.error);return loadUsers()}).then(function(){S.dlg=null;toast("已儲存");render()}).catch(function(err){alert("儲存失敗："+(err.message||err));renderDlg()});return}
    if(q("[data-udel]")){if(!confirm("刪除帳號「"+d.u.name+"」？（只要不讓他登入，用「停用」就好）"))return;api({action:"deleteUser",name:d.u.name}).then(function(j){if(!j.ok)throw new Error(j.error);return loadUsers()}).then(function(){S.dlg=null;render()}).catch(function(err){alert("刪除失敗："+(err.message||err))});return}
  }
}

// ---------- 頁面上的點擊 ----------
function onClick(e){
  if(shipClick(e))return;
  var t,q=function(s){return e.target.closest(s)};
  if(t=q("[data-open]")){var x=S.orders.filter(function(o){return o.id===t.dataset.open})[0];if(x)orderDlg(x);return}
  if(t=q("[data-gosite]")){S.filt={site:t.dataset.gosite,who:"",month:MONTH,q:""};S.page="jl";render();return}
  if(q("#csv")){csv();return}
  if(t=q("[data-stab]")){S.siteTab=t.dataset.stab;render();return}
  if(t=q("[data-sedit]")){var s=S.sites.filter(function(x){return x.id===t.dataset.sedit})[0];S.dlg={t:"site",orig:s,s:JSON.parse(JSON.stringify(s))};renderDlg();return}
  if(q("[data-snew]")){S.dlg={t:"site",isNew:1,orig:null,s:{id:"",name:"",co:"",addr:"",ppl:[["",""]],gone:[]}};renderDlg();return}
  if(t=q("[data-sundel]")){var s2=S.sites.filter(function(x){return x.id===t.dataset.sundel})[0];saveSites([{id:s2.id,name:s2.name,undel:true}]);return}
  if(t=q("[data-vtab]")){S.vTab=t.dataset.vtab;S.vDel=false;render();return}
  if(q("[data-vdeltab]")){S.vDel=true;render();return}
  if(t=q("[data-vedit]")){var tb=S.tables[S.vTab],r=tb.rows.filter(function(r){return r.row===+t.dataset.vedit})[0];S.dlg={t:"vrow",name:S.vTab,row:r.row,v:r.v};renderDlg();return}
  if(q("[data-vnew]")){S.dlg={t:"vrow",name:S.vTab,row:0,v:null};renderDlg();return}
  if(t=q("[data-vrest]")){saveRow(S.vTab,+t.dataset.vrest,{},false);return}
  if(t=q("[data-uedit]")){var u=S.users.filter(function(x){return x.name===t.dataset.uedit})[0];S.dlg={t:"user",u:u};renderDlg();return}
  if(q("[data-unew]")){S.dlg={t:"user",isNew:1,u:{name:"",pw:"",admin:false,disabled:false}};renderDlg();return}
}
var tmr;
function onInput(e){
  if(shipInput(e))return;
  var id=e.target.id;
  if(id==="fq"||id==="vq"){clearTimeout(tmr);var v=e.target.value.trim();tmr=setTimeout(function(){if(id==="fq")S.filt.q=v;else S.vq=v;render();var el=$(id);if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},350)}
  if(id==="siteQ"){var v2=e.target.value.trim();document.querySelectorAll("#page tr[data-row]").forEach(function(r){r.style.display=!v2||r.textContent.indexOf(v2)>=0?"":"none"})}
}
function onChange(e){
  if(shipChange(e))return;
  var id=e.target.id;
  if(id==="fsite"){S.filt.site=e.target.value;render()}
  if(id==="fwho"){S.filt.who=e.target.value;render()}
  if(id==="fmonth"){S.filt.month=e.target.value;render()}
  if(id==="vcat"){S.vcat=e.target.value;render()}
}

load().then(function(){shell();render()}).catch(function(e){if(e)gate("讀取失敗",String(e.message||e)+"。請確認網路後重試。","回叫料小幫手")});
})();
</script>
